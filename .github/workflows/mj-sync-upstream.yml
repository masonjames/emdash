# The fork has one workflow: watch for stable EmDash product releases and open
# a review-only PR. Upstream workflows, contributor bots, CLA checks, and
# upstream .github changes are deliberately excluded.
name: Mason EmDash release watch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mason-emdash-release-watch
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release candidate without write credentials
    if: github.repository == 'masonjames/emdash'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      branch: ${{ steps.candidate.outputs.branch }}
      candidate_tree: ${{ steps.candidate.outputs.candidate_tree }}
      previous_sha: ${{ steps.candidate.outputs.previous_sha }}
      previous_tag: ${{ steps.candidate.outputs.previous_tag }}
      published_at: ${{ steps.candidate.outputs.published_at }}
      release_sha: ${{ steps.candidate.outputs.release_sha }}
      release_tag: ${{ steps.candidate.outputs.release_tag }}
      release_url: ${{ steps.candidate.outputs.release_url }}
      status: ${{ steps.candidate.outputs.status }}
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: mj/prod
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce fork workflow policy
        run: node --test scripts/mj/tests/fork-policy.test.mjs

      - name: Discover release and prepare candidate tree
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          base_sha=$(git rev-parse HEAD)
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

          releases_json=$(gh api --method GET repos/emdash-cms/emdash/releases -f per_page=100)
          release_json=$(printf '%s' "$releases_json" | jq -c '
            [.[] |
              select(.draft == false and .prerelease == false) |
              select(.tag_name | test("^emdash@[0-9]+\\.[0-9]+\\.[0-9]+$"))
            ][0] // empty
          ')
          if [ -z "$release_json" ]; then
            echo "No stable emdash@x.y.z release was found." >&2
            exit 1
          fi

          release_tag=$(printf '%s' "$release_json" | jq -r .tag_name)
          release_url=$(printf '%s' "$release_json" | jq -r .html_url)
          published_at=$(printf '%s' "$release_json" | jq -r .published_at)
          if ! [[ "$release_tag" =~ ^emdash@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag: $release_tag" >&2
            exit 1
          fi
          if ! [[ "$release_url" =~ ^https://github.com/emdash-cms/emdash/releases/tag/ ]]; then
            echo "Unexpected release URL." >&2
            exit 1
          fi

          state_file=docs/operations/mj-upstream-release.json
          previous_tag=$(jq -r .release_tag "$state_file")
          previous_sha=$(jq -r .release_sha "$state_file")
          if ! [[ "$previous_tag" =~ ^emdash@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tracked release tag in $state_file." >&2
            exit 1
          fi
          if ! [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid tracked release SHA in $state_file." >&2
            exit 1
          fi

          git remote add upstream https://github.com/emdash-cms/emdash.git
          if [ "$previous_tag" = "$release_tag" ]; then
            git fetch --force --no-tags upstream \
              "refs/tags/$release_tag:refs/tags/$release_tag"
          else
            git fetch --force --no-tags upstream \
              "refs/tags/$previous_tag:refs/tags/$previous_tag" \
              "refs/tags/$release_tag:refs/tags/$release_tag"
          fi
          tracked_sha=$(git rev-parse "refs/tags/$previous_tag^{commit}")
          release_sha=$(git rev-parse "refs/tags/$release_tag^{commit}")
          if [ "$tracked_sha" != "$previous_sha" ]; then
            echo "Tracked release tag moved from $previous_sha to $tracked_sha." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$previous_sha" "$release_sha"; then
            echo "Release history is not a fast-forward from $previous_tag to $release_tag." >&2
            exit 1
          fi

          {
            echo "previous_tag=$previous_tag"
            echo "previous_sha=$previous_sha"
            echo "release_tag=$release_tag"
            echo "release_sha=$release_sha"
            echo "release_url=$release_url"
            echo "published_at=$published_at"
          } >> "$GITHUB_OUTPUT"

          if [ "$previous_tag" = "$release_tag" ] && [ "$previous_sha" = "$release_sha" ]; then
            echo "status=noop" >> "$GITHUB_OUTPUT"
            echo "Already tracking $release_tag at $release_sha." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          version=$(printf '%s' "$release_tag" | cut -d@ -f2)
          branch="automation/emdash-release-$(printf '%s' "$version" | tr . -)"
          git switch -c "$branch"
          git diff --binary --full-index "$previous_sha" "$release_sha" \
            -- . ':(exclude).github' > /tmp/emdash-release.patch
          if ! git apply --3way --index --whitespace=nowarn /tmp/emdash-release.patch; then
            echo "The release conflicts with Mason's carried production changes." >&2
            git status --short >&2
            exit 1
          fi

          jq -n \
            --arg previous_tag "$previous_tag" \
            --arg previous_sha "$previous_sha" \
            --arg release_tag "$release_tag" \
            --arg release_sha "$release_sha" \
            --arg release_url "$release_url" \
            --arg published_at "$published_at" \
            '{
              schema_version: 1,
              upstream_repository: "emdash-cms/emdash",
              previous_release_tag: $previous_tag,
              previous_release_sha: $previous_sha,
              release_tag: $release_tag,
              release_sha: $release_sha,
              release_url: $release_url,
              published_at: $published_at
            }' > "$state_file"
          git add "$state_file"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Sync EmDash release $release_tag"

          candidate_tree=$(git rev-parse 'HEAD^{tree}')
          {
            echo "status=ready"
            echo "branch=$branch"
            echo "candidate_tree=$candidate_tree"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared $release_tag as one downstream bot commit; upstream .github was excluded." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Reproduce candidate and open draft PR
    needs: prepare
    if: needs.prepare.outputs.status == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the exact reviewed base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce fork workflow policy
        run: node --test scripts/mj/tests/fork-policy.test.mjs

      - name: Reproduce candidate and publish draft PR
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          EXPECTED_TREE: ${{ needs.prepare.outputs.candidate_tree }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.MJ_SYNC_TOKEN }}
          PREVIOUS_SHA: ${{ needs.prepare.outputs.previous_sha }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_URL: ${{ needs.prepare.outputs.release_url }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "MJ_SYNC_TOKEN is required to publish a candidate branch and draft PR." >&2
            exit 1
          fi
          remote_base=$(git ls-remote origin refs/heads/mj/prod | awk '{print $1}')
          if [ "$remote_base" != "$BASE_SHA" ]; then
            echo "mj/prod moved from $BASE_SHA to $remote_base; wait for the next run." >&2
            exit 1
          fi

          git remote add upstream https://github.com/emdash-cms/emdash.git
          if [ "$PREVIOUS_TAG" = "$RELEASE_TAG" ]; then
            git fetch --force --no-tags upstream \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          else
            git fetch --force --no-tags upstream \
              "refs/tags/$PREVIOUS_TAG:refs/tags/$PREVIOUS_TAG" \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi
          if [ "$(git rev-parse "refs/tags/$PREVIOUS_TAG^{commit}")" != "$PREVIOUS_SHA" ]; then
            echo "The previous release tag no longer matches preparation." >&2
            exit 1
          fi
          if [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$RELEASE_SHA" ]; then
            echo "The release tag no longer matches preparation." >&2
            exit 1
          fi

          git switch -c "$BRANCH"
          git diff --binary --full-index "$PREVIOUS_SHA" "$RELEASE_SHA" \
            -- . ':(exclude).github' > /tmp/emdash-release.patch
          git apply --3way --index --whitespace=nowarn /tmp/emdash-release.patch

          state_file=docs/operations/mj-upstream-release.json
          jq -n \
            --arg previous_tag "$PREVIOUS_TAG" \
            --arg previous_sha "$PREVIOUS_SHA" \
            --arg release_tag "$RELEASE_TAG" \
            --arg release_sha "$RELEASE_SHA" \
            --arg release_url "$RELEASE_URL" \
            --arg published_at "$PUBLISHED_AT" \
            '{
              schema_version: 1,
              upstream_repository: "emdash-cms/emdash",
              previous_release_tag: $previous_tag,
              previous_release_sha: $previous_sha,
              release_tag: $release_tag,
              release_sha: $release_sha,
              release_url: $release_url,
              published_at: $published_at
            }' > "$state_file"
          git add "$state_file"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Sync EmDash release $RELEASE_TAG"

          actual_tree=$(git rev-parse 'HEAD^{tree}')
          if [ "$actual_tree" != "$EXPECTED_TREE" ]; then
            echo "Candidate tree mismatch: prepared $EXPECTED_TREE, reproduced $actual_tree." >&2
            exit 1
          fi

          remote_candidate=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          if [ -n "$remote_candidate" ]; then
            git fetch --no-tags origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            remote_tree=$(git rev-parse "$remote_candidate^{tree}")
            if [ "$remote_tree" != "$EXPECTED_TREE" ]; then
              echo "Existing candidate branch has a different tree; refusing to rewrite it." >&2
              exit 1
            fi
          else
            gh auth setup-git
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          version=$(printf '%s' "$RELEASE_TAG" | cut -d@ -f2)
          {
            echo "This draft applies the stable EmDash release [$RELEASE_TAG]($RELEASE_URL) to Mason's production fork."
            echo
            echo "- Previous tracked release: $PREVIOUS_TAG ($PREVIOUS_SHA)"
            echo "- Candidate release: $RELEASE_TAG ($RELEASE_SHA)"
            echo "- Upstream .github content is excluded; the fork keeps only its release watcher."
            echo "- Upstream history is represented by one bot-authored downstream commit, so upstream contributors are not added or mentioned."
            echo "- No CLA, localization, triage, review, release, or contributor-comment workflow runs on this PR."
            echo
            echo "Review the production diff and confirm Mason's carried upload behavior before marking this ready."
          } > /tmp/emdash-release-pr.md

          pr_number=$(gh pr list \
            --repo "$GH_REPOSITORY" \
            --base mj/prod \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            gh pr create \
              --repo "$GH_REPOSITORY" \
              --base mj/prod \
              --head "$BRANCH" \
              --draft \
              --title "chore: sync EmDash $version" \
              --body-file /tmp/emdash-release-pr.md
          else
            gh pr edit "$pr_number" \
              --repo "$GH_REPOSITORY" \
              --title "chore: sync EmDash $version" \
              --body-file /tmp/emdash-release-pr.md
          fi
